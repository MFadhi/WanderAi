name: wander_ai
description: WanderAI – AI-powered personal tour guide using Google Gemini + Google Maps Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Maps & Location
  google_maps_flutter: ^2.12.0
  geolocator: ^12.0.0

  # Networking (Gemini REST + Places API)
  dio: ^5.5.0

  # Images
  cached_network_image: ^3.3.1

  # UI & Animations
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Storage
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/
